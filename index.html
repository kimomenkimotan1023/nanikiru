<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>麻雀 実戦何切るトレーナー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+JP:wght@500;700;800;900&family=Noto+Serif+JP:wght@700;900&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    .hand-single-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      gap: 2px;
      padding-top: 8px;
    }
    .tile-fluid-item {
      position: relative;
      flex: 100 1 0%;
      aspect-ratio: 100 / 138;
      min-width: 0;
      max-width: 40px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .tile-fluid-item:hover { transform: translateY(-4px); }
    .tile-fluid-item:active { transform: translateY(-2px) scale(0.97); }
    .tile-fluid-item svg { width: 100%; height: 100%; display: block; }
    .tenkey-btn {
      user-select: none;
      -webkit-user-select: none;
      white-space: nowrap;
      transition: transform 0.05s ease, background-color 0.1s ease;
    }
    .tenkey-btn:active { transform: scale(0.96); }
    .mini-tile { width: 24px; aspect-ratio: 100 / 138; display: inline-block; vertical-align: middle; }
    .mini-tile-sm { width: 18px; aspect-ratio: 100 / 138; display: inline-block; vertical-align: middle; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 px-3 py-2 shadow-sm">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2 whitespace-nowrap">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="w-6 h-6 rounded-md bg-emerald-600 text-white font-serif font-black text-xs flex items-center justify-center shrink-0">切</span>
        <h1 class="text-sm sm:text-base font-black text-slate-900 truncate">麻雀 実戦何切るトレーナー</h1>
        <span id="mode-indicator-pill" class="hidden px-1.5 py-0.5 rounded bg-rose-600 text-white font-black text-[10px] shrink-0">復習中</span>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-toggle-custom" type="button" class="px-2.5 py-1 rounded-lg bg-indigo-50 hover:bg-indigo-100 active:scale-95 text-indigo-700 font-black text-[11px] sm:text-xs border border-indigo-200 whitespace-nowrap transition">手牌入力</button>
        <button id="btn-toggle-review" type="button" class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 active:scale-95 text-rose-700 font-black text-[11px] sm:text-xs border border-rose-200 whitespace-nowrap transition">復習 (0問)</button>
        <button id="btn-generate-next" type="button" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold text-[11px] sm:text-xs border border-slate-300 whitespace-nowrap transition">次へ ↻</button>
      </div>
    </div>
  </header>

  <div class="bg-slate-100 border-b border-slate-200 px-2 sm:px-3 py-1.5">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-1.5 text-[11px] sm:text-xs font-bold text-slate-700 whitespace-nowrap">
      <div class="flex items-center gap-2 sm:gap-4 min-w-0 overflow-hidden">
        <span>解答数: <strong id="stat-total" class="text-slate-900 font-black">0問</strong></span>
        <span class="text-slate-300">｜</span>
        <span>正解数: <strong id="stat-accuracy" class="text-emerald-700 font-black">0問 (0%)</strong></span>
        <span class="text-slate-300">｜</span>
        <span>連続正解: <strong id="stat-streak" class="text-amber-600 font-black">0問</strong></span>
      </div>
      <button id="btn-reset-stats" type="button" class="px-2 py-0.5 rounded bg-white hover:bg-slate-200 active:scale-95 text-slate-600 border border-slate-300 text-[10px] sm:text-[11px] font-bold shrink-0 transition">リセット</button>
    </div>
  </div>

  <main class="flex-1 max-w-xl w-full mx-auto px-2 sm:px-4 pt-2 pb-6 space-y-2.5">

    <!-- カスタム手牌入力パネル -->
    <section id="custom-panel" class="hidden bg-white border-2 border-indigo-500 rounded-2xl p-3 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between whitespace-nowrap">
        <span class="text-xs font-black text-indigo-900">任意の手牌14枚を入力 (<span id="custom-count">0</span>/14枚)</span>
        <div class="flex items-center gap-1.5">
          <button id="btn-custom-clear" type="button" class="px-2 py-0.5 rounded bg-rose-50 text-rose-700 border border-rose-200 text-[11px] font-bold">クリア</button>
          <button id="btn-custom-close" type="button" class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-300 text-[11px] font-bold">閉じる</button>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2 text-xs font-bold">
        <select id="custom-seat" class="px-2 py-1 rounded border border-slate-300 bg-slate-50">
          <option value="28">東場 南家(子)</option>
          <option value="27">東場 東家(親)</option>
          <option value="29">東場 西家(子)</option>
          <option value="30">東場 北家(子)</option>
        </select>
        <label class="flex items-center gap-1">
          <span>ドラ表示:</span>
          <select id="custom-dora" class="px-2 py-1 rounded border border-slate-300 bg-slate-50"></select>
        </label>
      </div>
      <div id="custom-palette" class="grid grid-cols-9 gap-1 bg-slate-50 p-2 rounded-xl border border-slate-200"></div>
      <div id="custom-error-msg" class="hidden text-center text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded-lg py-1"></div>
      <button id="btn-custom-analyze" type="button" class="tenkey-btn w-full h-10 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs shadow-sm">この14枚で何切る解析を実行</button>
    </section>

    <!-- 状況バー＆1列手牌ラック -->
    <section class="bg-white border border-slate-200 rounded-2xl p-2 sm:p-3.5 shadow-sm space-y-2">
      <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 whitespace-nowrap overflow-hidden">
        <span id="hud-wind-badge" class="px-2 py-0.5 rounded-md bg-emerald-600 text-white font-black text-xs shrink-0">東場 南家(子)</span>
      </div>
      <div class="flex items-center gap-4 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 whitespace-nowrap overflow-hidden">
        <div class="flex items-center gap-1.5 shrink-0">
          <span class="text-xs font-bold text-slate-600">ドラ表示牌</span>
          <div id="hud-dora-tile" class="w-6 sm:w-7 flex items-center"></div>
        </div>
      </div>
      <div class="bg-emerald-50/50 border border-emerald-200/80 rounded-xl px-1.5 py-2.5 sm:px-3 sm:py-3">
        <div id="hand-tiles-container" class="hand-single-row"></div>
      </div>
    </section>

    <!-- 打牌選択セクション -->
    <section id="answer-section" class="bg-white border border-slate-200 rounded-2xl p-2.5 sm:p-4 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between whitespace-nowrap">
        <span class="text-xs sm:text-sm font-black text-slate-800">何を切りますか？</span>
        <span class="text-[11px] font-bold text-slate-500">牌をタップで打牌選択</span>
      </div>
      <div id="discard-choices-grid" class="grid grid-cols-4 sm:grid-cols-7 gap-1.5 sm:gap-2"></div>
    </section>

    <!-- 結果＆詳細解析セクション -->
    <section id="result-section" class="hidden space-y-2.5">
      <div id="verdict-banner" class="rounded-2xl p-3.5 border-2 bg-white shadow-sm space-y-2">
        <div class="flex flex-wrap items-center justify-between gap-1.5">
          <div class="flex items-center gap-2">
            <span id="verdict-badge" class="px-2.5 py-0.5 rounded-md text-xs font-black shrink-0">正解</span>
            <span id="verdict-title" class="text-sm sm:text-base font-black text-slate-900"></span>
          </div>
          <span id="verdict-WaitCount" class="font-mono text-xs sm:text-sm font-black text-emerald-700"></span>
        </div>
        <div class="bg-white/90 border border-slate-200/90 rounded-xl px-3 py-2 flex items-center justify-between gap-2 whitespace-nowrap">
          <span class="text-xs font-bold text-slate-600 shrink-0">最善の打牌</span>
          <div id="verdict-best-tile" class="flex items-center gap-2 font-black text-sm sm:text-base text-slate-900"></div>
        </div>
        <div id="verdict-user-row" class="hidden bg-white/75 border border-rose-200 rounded-xl px-3 py-1.5 flex items-center justify-between gap-2 whitespace-nowrap">
          <span class="text-xs font-bold text-rose-700 shrink-0">あなたの選択</span>
          <span id="verdict-user-ans" class="font-black text-xs sm:text-sm text-rose-700"></span>
        </div>
        <div id="explain-reasoning" class="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs leading-relaxed font-bold text-slate-700"></div>
        <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-200/70 whitespace-nowrap">
          <span id="review-status-msg" class="text-[11px] font-bold text-slate-600 truncate"></span>
          <button id="btn-toggle-bookmark" type="button" class="px-2.5 py-1 rounded-lg bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-[11px] font-black shrink-0 transition">復習リストに残す</button>
        </div>
        <button id="btn-next-after-result" type="button" class="tenkey-btn w-full h-11 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm shadow-sm flex items-center justify-center">次の問題へ ▶</button>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-sm space-y-2">
        <div class="flex items-center justify-between border-b border-slate-200 pb-1.5 text-xs font-black text-slate-800 whitespace-nowrap">
          <span id="ukeire-section-title">最善打牌の有効牌・変化</span>
          <span id="ukeire-total-badge" class="font-mono text-emerald-700"></span>
        </div>
        <div id="best-ukeire-tiles" class="flex flex-wrap gap-1.5 pt-1"></div>
        <div id="best-tenpai-transitions" class="divide-y divide-slate-100 text-xs pt-1"></div>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-sm space-y-2">
        <div class="flex items-center justify-between border-b border-slate-200 pb-1.5 text-xs font-black text-slate-800 whitespace-nowrap">
          <span>打牌候補の比較（受け入れ・1手先の広さ・手役）</span>
        </div>
        <div id="candidate-comparison-list" class="divide-y divide-slate-100 text-xs"></div>
      </div>
    </section>
  </main>

  <script>
    const TILE_NAMES_JA = [
      '一萬','二萬','三萬','四萬','五萬','六萬','七萬','八萬','九萬',
      '一筒','二筒','三筒','四筒','五筒','六筒','七筒','八筒','九筒',
      '一索','二索','三索','四索','五索','六索','七索','八索','九索',
      '東','南','西','北','白','發','中'
    ];
    const KANJI_NUMS = ['一','二','三','四','五','六','七','八','九'];
    const JIHAI_CHARS = ['東','南','西','北','白','發','中'];

    function drawCleanPin(cx, cy, r, fillHex) {
      const ringR = (r * 0.56).toFixed(1), centerR = (r * 0.22).toFixed(1), strokeW = Math.max(2.0, r * 0.15).toFixed(1);
      return `<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${fillHex}" /><circle cx="${cx}" cy="${cy}" r="${ringR}" fill="none" stroke="#ffffff" stroke-width="${strokeW}" /><circle cx="${cx}" cy="${cy}" r="${centerR}" fill="#ffffff" /></g>`;
    }

    function drawCleanBamboo(x1, y1, x2, y2, fillHex, width = 15) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, len = Math.hypot(x2 - x1, y2 - y1);
      const angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI) - 90, r = width / 2;
      return `<g transform="translate(${mx.toFixed(1)}, ${my.toFixed(1)}) rotate(${angle.toFixed(1)})"><rect x="${(-r).toFixed(1)}" y="${(-len / 2).toFixed(1)}" width="${width.toFixed(1)}" height="${len.toFixed(1)}" rx="${r.toFixed(1)}" fill="${fillHex}" /><rect x="${(-r - 1).toFixed(1)}" y="-2.8" width="${(width + 2).toFixed(1)}" height="5.6" rx="2" fill="#ffffff" /><line x1="${(-r).toFixed(1)}" y1="0" x2="${r.toFixed(1)}" y2="0" stroke="${fillHex}" stroke-width="1.5" /></g>`;
    }

    function renderTileSVG(tileIdx, { highlight = false } = {}) {
      const NAVY = '#1e3a8a', RED = '#dc2626', GREEN = '#15803d', INK = '#0f172a';
      const SERIF = `'Shippori Mincho B1', 'Noto Serif JP', serif`;
      let content = '';
      if (tileIdx >= 0 && tileIdx <= 8) {
        content = `<text x="50" y="60" text-anchor="middle" font-family="${SERIF}" font-weight="900" font-size="62" fill="${INK}">${KANJI_NUMS[tileIdx]}</text><text x="50" y="121" text-anchor="middle" font-family="${SERIF}" font-weight="900" font-size="56" fill="${RED}">萬</text>`;
      } else if (tileIdx >= 9 && tileIdx <= 17) {
        const n = tileIdx - 8;
        if (n === 1) content = `<circle cx="50" cy="70" r="41" fill="${NAVY}" /><circle cx="50" cy="70" r="32" fill="none" stroke="#ffffff" stroke-width="4" /><circle cx="50" cy="70" r="24" fill="${RED}" /><circle cx="50" cy="70" r="13" fill="none" stroke="#ffffff" stroke-width="3.2" /><circle cx="50" cy="70" r="5.5" fill="#ffffff" />`;
        else if (n === 2) content = drawCleanPin(50, 36, 26, NAVY) + drawCleanPin(50, 104, 26, NAVY);
        else if (n === 3) content = drawCleanPin(23, 27, 21, GREEN) + drawCleanPin(50, 70, 21, RED) + drawCleanPin(77, 113, 21, NAVY);
        else if (n === 4) content = drawCleanPin(27, 36, 22, NAVY) + drawCleanPin(73, 36, 22, NAVY) + drawCleanPin(27, 104, 22, NAVY) + drawCleanPin(73, 104, 22, NAVY);
        else if (n === 5) content = drawCleanPin(25, 30, 19.5, NAVY) + drawCleanPin(75, 30, 19.5, NAVY) + drawCleanPin(50, 70, 20, RED) + drawCleanPin(25, 110, 19.5, NAVY) + drawCleanPin(75, 110, 19.5, NAVY);
        else if (n === 6) content = drawCleanPin(27, 27, 18.5, NAVY) + drawCleanPin(73, 27, 18.5, NAVY) + drawCleanPin(27, 77, 18.5, RED) + drawCleanPin(73, 77, 18.5, RED) + drawCleanPin(27, 114, 18.5, RED) + drawCleanPin(73, 114, 18.5, RED);
        else if (n === 7) content = drawCleanPin(22, 22, 16, GREEN) + drawCleanPin(50, 35, 16, GREEN) + drawCleanPin(78, 48, 16, GREEN) + drawCleanPin(27, 83, 17.5, RED) + drawCleanPin(73, 83, 17.5, RED) + drawCleanPin(27, 116, 17.5, RED) + drawCleanPin(73, 116, 17.5, RED);
        else if (n === 8) { for (let r = 0; r < 4; r++) { const y = 23 + r * 31; content += drawCleanPin(27, y, 15, NAVY) + drawCleanPin(73, y, 15, NAVY); } }
        else if (n === 9) { const rc = [NAVY, RED, GREEN], ys = [26, 70, 114], xs = [21, 50, 79]; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) content += drawCleanPin(xs[c], ys[r], 15, rc[r]); }
      } else if (tileIdx >= 18 && tileIdx <= 26) {
        const n = tileIdx - 17;
        if (n === 1) content = `<circle cx="50" cy="55" r="34" fill="#dcfce7" stroke="${GREEN}" stroke-width="3.5" /><path d="M22 96 C20 64, 35 44, 50 44 C65 44, 80 64, 78 96 C68 114, 32 114, 22 96 Z" fill="${GREEN}" /><circle cx="50" cy="35" r="11" fill="${GREEN}" stroke="#ffffff" stroke-width="2" /><path d="M44 20 L50 10 L56 20 Z" fill="${RED}" /><circle cx="50" cy="77" r="16" fill="${RED}" stroke="#ffffff" stroke-width="2.5" /><circle cx="50" cy="77" r="6.5" fill="#fef08a" /><line x1="20" y1="120" x2="80" y2="120" stroke="${RED}" stroke-width="6" stroke-linecap="round" />`;
        else if (n === 2) content = drawCleanBamboo(50, 12, 50, 63, GREEN, 18) + drawCleanBamboo(50, 77, 50, 128, GREEN, 18);
        else if (n === 3) content = drawCleanBamboo(50, 12, 50, 63, GREEN, 17.5) + drawCleanBamboo(27, 77, 27, 128, GREEN, 17.5) + drawCleanBamboo(73, 77, 73, 128, GREEN, 17.5);
        else if (n === 4) content = drawCleanBamboo(27, 12, 27, 63, GREEN, 17.5) + drawCleanBamboo(73, 12, 73, 63, GREEN, 17.5) + drawCleanBamboo(27, 77, 27, 128, GREEN, 17.5) + drawCleanBamboo(73, 77, 73, 128, GREEN, 17.5);
        else if (n === 5) content = drawCleanBamboo(21, 12, 21, 63, GREEN, 15.5) + drawCleanBamboo(79, 12, 79, 63, GREEN, 15.5) + drawCleanBamboo(21, 77, 21, 128, GREEN, 15.5) + drawCleanBamboo(79, 77, 79, 128, GREEN, 15.5) + drawCleanBamboo(50, 44, 50, 96, RED, 16);
        else if (n === 6) content = drawCleanBamboo(21, 12, 21, 63, GREEN, 15.5) + drawCleanBamboo(50, 12, 50, 63, GREEN, 15.5) + drawCleanBamboo(79, 12, 79, 63, GREEN, 15.5) + drawCleanBamboo(21, 77, 21, 128, GREEN, 15.5) + drawCleanBamboo(50, 77, 50, 128, GREEN, 15.5) + drawCleanBamboo(79, 77, 79, 128, GREEN, 15.5);
        else if (n === 7) content = drawCleanBamboo(50, 10, 50, 45, RED, 15) + drawCleanBamboo(21, 51, 21, 86, GREEN, 15) + drawCleanBamboo(50, 51, 50, 86, GREEN, 15) + drawCleanBamboo(79, 51, 79, 86, GREEN, 15) + drawCleanBamboo(21, 92, 21, 128, GREEN, 15) + drawCleanBamboo(50, 92, 50, 128, GREEN, 15) + drawCleanBamboo(79, 92, 79, 128, GREEN, 15);
        else if (n === 8) content = drawCleanBamboo(18, 12, 18, 63, GREEN, 14) + drawCleanBamboo(22, 14, 47, 60, GREEN, 13.5) + drawCleanBamboo(78, 14, 53, 60, GREEN, 13.5) + drawCleanBamboo(82, 12, 82, 63, GREEN, 14) + drawCleanBamboo(18, 77, 18, 128, GREEN, 14) + drawCleanBamboo(22, 126, 47, 80, GREEN, 13.5) + drawCleanBamboo(78, 126, 53, 80, GREEN, 13.5) + drawCleanBamboo(82, 77, 82, 128, GREEN, 14);
        else if (n === 9) { const xs = [21, 50, 79], cols = [GREEN, RED, GREEN], ys = [[10, 45], [51, 86], [92, 128]]; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) content += drawCleanBamboo(xs[c], ys[r][0], xs[c], ys[r][1], cols[c], 15); }
      } else if (tileIdx >= 27 && tileIdx <= 33) {
        const z = tileIdx - 27;
        if (z === 4) content = `<rect x="15" y="18" width="70" height="100" rx="10" fill="#ffffff" stroke="#334155" stroke-width="4.5" /><rect x="23" y="26" width="54" height="84" rx="6" fill="none" stroke="#94a3b8" stroke-width="2.5" />`;
        else content = `<text x="50" y="98" text-anchor="middle" font-family="${SERIF}" font-weight="900" font-size="76" fill="${z === 5 ? GREEN : z === 6 ? RED : INK}">${JIHAI_CHARS[z]}</text>`;
      }
      const borderStroke = highlight ? '#059669' : '#64748b';
      const borderWidth = highlight ? '4.5' : '3';
      const faceBg = highlight ? '#ecfdf5' : '#ffffff';
      return `<svg viewBox="0 0 100 138" class="w-full h-full select-none"><rect x="2" y="6" width="96" height="130" rx="11" fill="#cbd5e1" /><rect x="2" y="3.5" width="96" height="130" rx="11" fill="#f59e0b" /><rect x="2" y="2" width="96" height="128" rx="11" fill="${faceBg}" stroke="${borderStroke}" stroke-width="${borderWidth}" />${content}</svg>`;
    }
  </script>
  <script src="engine.js"></script>
</body>
</html>
